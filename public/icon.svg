<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f0a"/>
      <stop offset="50%" stop-color="#120906"/>
      <stop offset="100%" stop-color="#080504"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Glowing Emblem -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)" filter="blur(30px)"/>

  <!-- Central Squircle Icon Badge -->
  <rect x="116" y="100" width="280" height="280" rx="64" fill="url(#primaryGrad)" filter="url(#shadow)"/>

  <!-- Video Camera & Play Symbol in Solid Dark (#0c0a09) -->
  <g transform="translate(160, 150) scale(1)">
    <!-- Video body -->
    <rect x="15" y="40" width="115" height="110" rx="26" fill="#0c0a09"/>
    <!-- Video lens lens right -->
    <path d="M135 68 L175 42 C181 38 188 42 188 49 L188 141 C188 148 181 152 175 148 L135 122 Z" fill="#0c0a09"/>
    <!-- Play triangle inside -->
    <polygon points="60,72 60,118 98,95" fill="#facc15"/>
  </g>

  <!-- Miazoom Red & Yellow Indicator Dots -->
  <circle cx="236" cy="425" r="8" fill="#ef4444"/>
  <circle cx="256" cy="425" r="8" fill="#f59e0b"/>
  <circle cx="276" cy="425" r="8" fill="#facc15"/>
</svg>
